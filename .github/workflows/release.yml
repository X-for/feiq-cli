name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify embedded Web UI is current
        run: git diff --exit-code -- web/dist

      - name: Run tests
        run: go test -race ./...

      - name: Build release archives
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/$GITHUB_REF_NAME"/*.tar.gz \
            "dist/$GITHUB_REF_NAME/checksums.txt" \
            --verify-tag \
            --generate-notes \
            --title "feiq-cli $GITHUB_REF_NAME"
