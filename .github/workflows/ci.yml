name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Verify embedded Web UI is current
        run: git diff --exit-code -- web/dist

      - name: Run race tests
        run: go test -race ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Verify release cross-builds
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build ./cmd/feiq-cli
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./cmd/feiq-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/feiq-cli
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./cmd/feiq-cli
